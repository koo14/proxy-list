name: "Upload SOCKS5 Proxies to Gist"

on:
  # 定时触发：每 6 小时自动执行一次 (UTC 时间 0:15, 6:15, 12:15, 18:15)
  schedule:
    - cron: "15 */6 * * *"

  # 联动触发：在 Fetch 动作成功执行后自动触发上传
  workflow_run:
    workflows: ["Fetch SOCKS5 Proxies"]
    types:
      - completed

  # 手动触发：可在 GitHub Actions 页面直接点击 Run workflow，并支持手动输入 Gist URL
  workflow_dispatch:
    inputs:
      gist_url:
        description: "Gist URL (格式如: https://gist.github.com/<user>/<gist-id>) 或 Gist ID"
        required: false
        default: ""
        type: string

jobs:
  upload:
    name: "Upload Proxy Files to Gist"
    # 当被 workflow_run 触发时，仅在前置工作流执行成功时才运行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    # 默认 Gist URL 配置（优先从仓库 Variables/Secrets 读取，也可在此写死默认值）
    env:
      # TODO: [HUMAN] 在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置 GIST_URL 或在此直接填入
      DEFAULT_GIST_URL: "https://gist.github.com/<user>/<gist-id>"

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Upload SOCKS5 Files to Gist"
        env:
          # 优先级：手动输入 > 仓库 Variables GIST_URL > 仓库 Secrets GIST_URL > workflow 内默认值
          GIST_URL: ${{ inputs.gist_url || vars.GIST_URL || secrets.GIST_URL || env.DEFAULT_GIST_URL }}
          # TODO: [HUMAN] 在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置 GIST_TOKEN (需勾选 'gist' 权限)
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          echo "Starting upload to Gist..."
          python scripts/upload_to_gist.py \
            --gist-url "$GIST_URL" \
            --token "$GIST_TOKEN" \
            --dir proxies \
            --keyword "socks5"
